version: "1.0"
agents:
  # 1. Developer (GLM 4.7) - Uses standard Build Agent
  - id: iron-developer
    name: "Iron Developer"
    description: "Initial code implementation (GLM 4.7)"
    capabilities: [coding, planning, worker-assistant]
    opencode_agent: build
    model_id: zai-coding-plan/glm-4.7
    priority: 10
    active: true
    metadata:
      role: developer

  # 2. Simple Tester (GLM 4.7)
  - id: iron-tester-simple
    name: "Iron Simple Tester"
    description: "Linting and Syntax checks (GLM 4.7)"
    capabilities: [linting, basic-testing, worker-assistant]
    opencode_agent: ashep-tester-lint
    model_id: zai-coding-plan/glm-4.7
    priority: 10
    active: true
    metadata:
      role: tester

  # 3. Functional Tester (GLM 4.7)
  - id: iron-tester-func
    name: "Iron Functional Tester"
    description: "Unit and Functional tests (GLM 4.7)"
    capabilities: [integration-testing, deep-testing, worker-assistant]
    opencode_agent: ashep-tester-functional
    model_id: zai-coding-plan/glm-4.7
    priority: 10
    active: true
    metadata:
      role: tester

  # 3b. System Tester (Disabled by default)
  - id: iron-tester-system
    name: "Iron System Tester"
    description: "Full Integration/System tests (GLM 4.7)"
    capabilities: [system-testing]
    opencode_agent: ashep-tester-system
    model_id: zai-coding-plan/glm-4.7
    priority: 8
    active: false
    metadata:
      role: tester

  # 4. Fixer (Gemini 3 Pro) - Uses standard Build Agent
  - id: iron-fixer
    name: "Iron Fixer"
    description: "Fixes bugs found by testers (Gemini 3 Pro)"
    capabilities: [debugging, coding-fix, debugger-routing]
    opencode_agent: build
    model_id: google/gemini-3-pro-preview
    priority: 10
    active: true
    metadata:
      role: fixer

  # 5. Validator (Grok Code)
  - id: iron-validator
    name: "Iron Validator"
    description: "Task requirements validation (Grok Code)"
    capabilities: [validation, validation-decision]
    opencode_agent: ashep-task-completion-validator
    model_id: opencode/grok-code
    priority: 10
    active: true
    metadata:
      role: validator

  # 6. Git Operator (Grok Code)
  - id: iron-git
    name: "Iron Git Operator"
    description: "Commit and Close (Grok Code)"
    capabilities: [git-ops]
    opencode_agent: ashep-github-master
    model_id: opencode/grok-code
    priority: 10
    active: true
    metadata:
      role: ops
